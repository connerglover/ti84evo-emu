[workspace]
resolver = "3"
members = ["crates/armv8m", "crates/evo-core", "crates/evo-hw", "crates/evo-image", "apps/evo-cli", "apps/evo-gui"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.36.2", features = ["persistence"] }
egui = { version = "0.36.2", features = ["serde"] }
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rfd = "0.17.2"
arboard = "3.6.1"
png = "0.18.1"
openh264 = "0.9.9"
mp4 = "0.14.0"
ureq = "3.4.2"
webbrowser = "1.2.4"
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = "fat"

# Save states hash the 16 MiB flash (`Machine::nv_fingerprint`); unoptimized SHA-256 would make
# every save and load in a debug test take about a second.
[profile.dev.package.sha2]
opt-level = 3
