[workspace]
resolver = "3"
members = ["crates/armv8m", "crates/evo-core", "crates/evo-hw", "crates/evo-image", "apps/evo-cli"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
clap = { version = "4.6", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

[profile.release]
codegen-units = 1
lto = "fat"

# Save states hash the 16 MiB flash (`Machine::nv_fingerprint`); unoptimized SHA-256 would make
# every save and load in a debug test take about a second.
[profile.dev.package.sha2]
opt-level = 3
