name: Windows package

# Called by CI only after both platform jobs pass. Main/manual runs upload an
# artifact; v* tag runs also publish it as a GitHub Release.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  windows:
    name: Build and package
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.98.0"
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: release-Windows
      - name: Build
        run: cargo build --release --locked -p evo-gui -p evo-cli
      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "ti84evo-emu-$env:GITHUB_REF_NAME-windows-x64" } else { "ti84evo-emu-$($env:GITHUB_SHA.Substring(0,7))-windows-x64" }
          New-Item -ItemType Directory -Force dist/$name | Out-Null
          Copy-Item target/release/evo-gui.exe, target/release/evo-cli.exe, LICENSE, README.md dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
          archive: false
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/${{ env.ZIP_NAME }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
