name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: clippy
      # rfd (xdg-portal), arboard (x11rb) and openh264-sys2 (C/C++ source build) need no packages
      # beyond these and the runner's compiler.
      # eframe (evo-gui) needs the xkbcommon and wayland headers on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      # Same packages as clippy: rfd, arboard and openh264-sys2 need nothing more.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo test --workspace

  gui-snapshots:
    # Golden images of the GUI on the fake backend. kittest prefers a CPU
    # wgpu adapter, which is WARP on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - run: cargo test -p evo-gui --features snapshots --test snapshots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-snapshot-diffs
          path: apps/evo-gui/tests/snapshots/*.png

  testprogs:
    # The committed test program images (tools/testprogs/out) must match their sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - run: sh tools/testprogs/build.sh
      - run: git diff --exit-code tools/testprogs/out
      - name: No new, uncommitted images
        run: test -z "$(git status --porcelain tools/testprogs/out)"

  difftest:
    # Differential testing against Unicorn (GPL-2.0, test-only `difftest` feature).
    runs-on: ubuntu-latest
    env:
      DIFFTEST_CASES: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: clippy
      # unicorn-engine-sys builds Unicorn with CMake and runs bindgen (libclang).
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libclang-dev
      - run: cargo clippy -p armv8m --all-targets --features difftest -- -D warnings
      - run: cargo test -p armv8m --features difftest
