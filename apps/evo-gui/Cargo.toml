[package]
name = "evo-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Desktop GUI front end of the TI-84 Evo emulator"

[features]
# Enables the golden-image snapshot tests (Task 5).
snapshots = []

[dependencies]
armv8m = { path = "../../crates/armv8m" }
evo-core = { path = "../../crates/evo-core" }
evo-hw = { path = "../../crates/evo-hw" }
evo-image = { path = "../../crates/evo-image" }
eframe.workspace = true
egui.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
rfd.workspace = true
arboard.workspace = true
png.workspace = true
openh264.workspace = true
mp4.workspace = true
ureq.workspace = true
webbrowser.workspace = true
sha2.workspace = true

[dev-dependencies]
evo-image = { path = "../../crates/evo-image", features = ["testutil"] }
egui_kittest.workspace = true
