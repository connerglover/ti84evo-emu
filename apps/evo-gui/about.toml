# cargo-about 0.9.2 configuration for the third-party licenses file shown in Help › Third-party
# licenses. Regenerate with (from the repository root):
#   cargo about generate -m apps/evo-gui/Cargo.toml apps/evo-gui/about.hbs -o apps/evo-gui/assets/third-party-licenses.txt
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # managed (via gdbstub in evo-core); OSI-approved.
    "0BSD",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
